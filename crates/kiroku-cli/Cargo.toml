[package]
name = "kiroku-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kiroku"
path = "src/main.rs"

[dependencies]
kiroku-core = { path = "../kiroku-core" }
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
reqwest.workspace = true
walkdir.workspace = true
wreq = { version = "6.0.0-rc.31", optional = true }
wreq-util = { version = "3.0.0-rc.14", optional = true }

[features]
# TLS 指纹伪装(BoringSSL,Windows 上需 cmake/nasm),仅用于 `kiroku poc ... wreq`;默认关闭
wreq = ["dep:wreq", "dep:wreq-util"]

[dev-dependencies]
tempfile = "3"
