[package]
name = "kiroku-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "kiroku_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset:用 convertFileSrc 直接展示库里的本地海报
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
kiroku-core = { path = "../../../crates/kiroku-core" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
log = "0.4"
tauri-plugin-notification = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"

[[example]]
name = "native_shutdown_smoke"
path = "../../../tools/native_shutdown_smoke.rs"
test = false

[[example]]
name = "native_job_smoke"
path = "../../../tools/native_job_smoke.rs"
test = false
