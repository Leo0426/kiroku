[workspace]
resolver = "2"
members = ["crates/kiroku-core", "crates/kiroku-cli", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "signal"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "cookies"] }
walkdir = "2"
tokio-util = "0.7"
rusqlite = { version = "0.40", features = ["bundled"] }

# 开发构建(tauri dev)里 SHA-256 不开优化只有约 30 MB/s(开优化约 450 MB/s);整理视频要完整读三遍做摘要,
# 8 GB 的视频因此要等半小时以上。
# 哈希与图片解码这类纯计算的依赖在开发构建里也按发布级优化编译。
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
