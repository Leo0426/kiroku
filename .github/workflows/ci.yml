name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Rust tests (core + cli)
        shell: bash
        run: |
          set -o pipefail
          cargo test -p kiroku-core -p kiroku-cli --no-fail-fast 2>&1 | tee test.log && exit 0
          # 每个失败测试的输出写成一条注解,不用下载日志就能在检查结果里看到
          awk '/^---- .* stdout ----$/{if(b!="")print b; b=$0; next} b!=""&&/^$/{print b; b=""; next} b!=""{b=b"%0A"$0} END{if(b!="")print b}' test.log \
            | head -10 | while IFS= read -r block; do echo "::error title=test failure::${block}"; done
          grep -E "^error(\[|:)" test.log | head -5 | while IFS= read -r l; do echo "::error title=build error::${l}"; done
          exit 1

      - name: Frontend install, type-check, build
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm build

      - name: Desktop backend compiles
        run: cargo check -p kiroku-desktop

