name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Rust tests (core + cli)
        run: cargo test -p kiroku-core -p kiroku-cli

      - name: Frontend install, type-check, build
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm build

      - name: Desktop backend compiles
        run: cargo check -p kiroku-desktop

